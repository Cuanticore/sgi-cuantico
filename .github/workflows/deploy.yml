name: Build and Deploy

on:
  push:
    branches: [main]

# The runner is self-hosted ON the deployment host, so every `run:` below is already
# executing as `ubuntu` on the server. There is no ssh hop.
#
# The stack is deployed with an EXPLICIT `-f docker-compose.prod.yml`, and the file that
# was governing the stack before this change is never overwritten — it is copied aside
# with a timestamp. That matters because the previous file was maintained by hand on the
# server (and before that generated by Coolify), so nobody can prove from the repository
# what it contains. Keeping it on disk makes the rollback one command instead of an
# archaeology exercise:
#
#   cd /home/ubuntu/sgi-cuantico && docker compose -f docker-compose.yml up -d
env:
  DESTINO: /home/ubuntu/sgi-cuantico
  COMPOSE: docker-compose.prod.yml

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before anything is built or pulled. A deploy that fails on a missing variable
      # AFTER recreating the container is an outage; failing here costs nothing, and the
      # old container keeps serving.
      - name: Preflight — variables required by the server
        run: |
          set -euo pipefail
          archivo="$DESTINO/.env"
          if [ ! -f "$archivo" ]; then
            echo "::error::No existe $archivo en el servidor." >&2
            exit 1
          fi

          faltan=""
          for clave in DATABASE_URL SGI_POSTGRES_PASSWORD; do
            # Anchored so a commented-out line does not count as set.
            grep -Eq "^[[:space:]]*${clave}=.+" "$archivo" || faltan="$faltan $clave"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan en $archivo:$faltan" >&2
            echo "DATABASE_URL apunta al alias de la red de compose:" >&2
            echo "  postgresql://sgi:<clave>@sgi-postgres:5432/sgi_sgsi?schema=public" >&2
            echo "SGI_POSTGRES_PASSWORD tiene que ser esa misma clave." >&2
            exit 1
          fi

          # Not an error, a warning. The fallback role grants permissions the Directory
          # never granted; absent, the fallback is no access, which is what production
          # wants. The header already flags it on screen when it is in use.
          if grep -Eq "^[[:space:]]*SGI_ROL_POR_DEFECTO=.+" "$archivo"; then
            echo "::warning::SGI_ROL_POR_DEFECTO está definido en producción: cualquier sesión sin claim de grupos recibirá ese rol."
          fi

          echo "preflight ok"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          docker buildx build \
            --cache-from type=local,src=/home/ubuntu/docker-cache/sgi-cuantico \
            --cache-to type=local,dest=/home/ubuntu/docker-cache/sgi-cuantico,mode=max \
            --tag ghcr.io/cuanticore/sgi-cuantico:latest \
            --push \
            .

      # Until this step existed, the compose file and the backup script lived ONLY on the
      # server: the copies in the repository were documentation nobody applied. Any change
      # to either needed a hand edit over ssh, which is the drift that eventually deploys
      # a stack nobody can reproduce.
      - name: Sync compose and deploy scripts to the server
        run: |
          set -euo pipefail
          mkdir -p "$DESTINO"

          # The file that governed the stack before this change, kept verbatim. Copied
          # once and never clobbered by a later run, so the oldest copy is the original.
          if [ -f "$DESTINO/docker-compose.yml" ] && [ ! -f "$DESTINO/docker-compose.anterior.yml" ]; then
            cp -p "$DESTINO/docker-compose.yml" "$DESTINO/docker-compose.anterior.yml"
            echo "respaldo del compose anterior: $DESTINO/docker-compose.anterior.yml"
          fi

          # Printed, not acted on. This is the first time anyone can see what the hand
          # maintained file carried that the repository's copy does not — read it on the
          # first run, because a label or a variable only present there is a routing
          # outage waiting for a recreate.
          if [ -f "$DESTINO/docker-compose.anterior.yml" ]; then
            echo "--- diff: compose anterior (izquierda) vs repositorio (derecha) ---"
            diff -u "$DESTINO/docker-compose.anterior.yml" "$GITHUB_WORKSPACE/$COMPOSE" || true
            echo "--- fin del diff ---"
          fi

          install -m 0644 "$GITHUB_WORKSPACE/$COMPOSE" "$DESTINO/$COMPOSE"
          mkdir -p "$DESTINO/deploy"
          install -m 0755 "$GITHUB_WORKSPACE/deploy/"*.sh "$DESTINO/deploy/"

      - name: Deploy
        # `set -e` matters: without it a failed migration is a printed error and a green
        # tick, and the application starts against a schema it does not match.
        run: |
          set -euo pipefail
          cd "$DESTINO"
          dc() { docker compose -f "$COMPOSE" "$@"; }

          dc pull

          # The database first, and only the database. The application depends on its
          # healthcheck, so starting everything at once would race the migration.
          dc up -d sgi-postgres
          dc exec -T sgi-postgres sh -c \
            'for i in $(seq 1 30); do pg_isready -U sgi -d sgi_sgsi && exit 0; sleep 2; done; exit 1'

          # THE GATE. `migrate deploy` applies pending migrations and never generates or
          # resets. If it fails the job stops here and the old container keeps serving:
          # a deployment that half-applies a schema is worse than one that does not happen.
          #
          # `-w /opt/cli`: the CLI and its full dependency tree live there, not in /app.
          # Run from /app this fails with `sh: prisma: not found` — see the Dockerfile.
          dc run --rm --no-deps -w /opt/cli sgi-cuantico-prod \
            npx prisma migrate deploy

          # Scoped to the application, and `--wait`.
          #
          # Not scoped, `--force-recreate` also restarts the database that was just started
          # and migrated — an avoidable outage window on every deploy. And without `--wait`,
          # compose exits 0 the moment the container is CREATED: a container that then
          # crashes on boot produced a green deploy with the previous one already gone. The
          # healthcheck in docker-compose.prod.yml is what `--wait` waits for.
          dc up -d --force-recreate --remove-orphans --wait --wait-timeout 180 sgi-cuantico-prod

          # Belt and braces: ask the running container for the sign-in page. If the
          # healthcheck is ever removed or relaxed, this still fails the job rather than
          # reporting a deploy that never served a request.
          dc exec -T sgi-cuantico-prod node -e \
            "fetch('http://127.0.0.1:3004/auth/signin').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);console.log('humo ok '+r.status)})"

      - name: Backup after a successful deploy
        # A dump taken right after a deploy is the one you want when the deploy turns out
        # to have been a mistake. Retention is 30 days; the cron in
        # deploy/respaldo-postgres.sh covers the daily schedule.
        run: |
          set -euo pipefail
          cd "$DESTINO"
          SGI_COMPOSE_FILE="$COMPOSE" bash deploy/respaldo-postgres.sh
