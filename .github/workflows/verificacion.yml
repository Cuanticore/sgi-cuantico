name: Verificación

# EL GATE, PERO ANTES DE MERGEAR.
#
# `Build and Deploy` también verifica, y eso no vuelve redundante a este workflow: son dos
# momentos distintos. Allá el rojo aparece cuando el cambio YA está en `main` —la rama
# protegida queda rota y hay que arreglarla con prisa, que es como se cometen los segundos
# errores—. Acá aparece mientras el cambio todavía es un PR que nadie mergeó.
#
# En este repo mergear a `main` despliega a producción. No hay staging ni revisión después
# del merge: lo que se mergea, sale. Así que éste es, literalmente, el último punto donde un
# problema cuesta barato.
on:
  pull_request:
    branches: [main]
  # Para poder pedirlo a mano sobre una rama sin abrir el PR todavía.
  workflow_dispatch:

# Empujar tres veces seguidas a un PR no debería dejar tres verificaciones compitiendo por el
# único runner que hay —que además es el servidor de producción—. Sólo interesa la última.
concurrency:
  group: verificacion-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    # El runner es self-hosted y vive EN el host de producción. Un PR desde un fork ejecutaría
    # código de un desconocido en esa máquina, así que se limita a las ramas de este mismo
    # repositorio: quien puede abrir una rama acá ya puede empujar a `main`, y no se le concede
    # nada nuevo. Un PR desde un fork no falla: se queda sin correr, y se ve que no corrió.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      contents: read
      # Para dejar el error como comentario en el PR. Sin esto la API responde 403 y el paso
      # falla en silencio: el trabajo YA estaba rojo, así que nadie nota que además el
      # comentario no salió. Es el permiso mínimo que hace falta — no incluye escribir código.
      pull-requests: write

    # Dónde se acumula la salida de todos los pasos de verificación. `$RUNNER_TEMP` se limpia
    # solo entre ejecuciones, que importa en un runner cuyo workspace persiste.
    env:
      RUTA_LOG: ${{ runner.temp }}/verificacion.log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # el mismo major que `node:22-alpine` en el Dockerfile
          cache: npm

      # Acá SÍ se corre el build, y es la diferencia con el paso equivalente del despliegue.
      #
      # Allá la imagen se construye de todos modos en el paso siguiente, así que compilar dos
      # veces no agrega información. Acá no hay imagen: si el build no entra, el PR se ve
      # verde y el fallo aparece después del merge, cuando ya es un despliegue caído. Es
      # exactamente lo que pasó el 16/09/2026.
      #
      # Cuesta más de un minuto. Es el minuto más barato de todo el recorrido.
      #
      # La salida se duplica a `$RUTA_LOG` con `tee` porque **un paso no puede leer el log del
      # paso anterior**: GitHub no se lo expone al runner. Si se quiere comentar el error en el
      # PR, hay que guardarlo al pasar.
      #
      # `set -euo pipefail` ya estaba, y acá pasa a ser crítico: sin `pipefail`, el código de
      # salida de `npm … | tee` es el de `tee`, que sale 0 SIEMPRE. El gate quedaría verde con
      # los tipos rotos y la suite caída, y no habría nada en el diff que lo delate: una tubería
      # de más. `verificacion-comenta-en-el-pr.test.ts` falla si alguien quita el `pipefail`.
      - name: Verificación — tipos, lint, pruebas y build
        run: |
          set -euo pipefail
          { echo; echo "===== npm ci ====="; } | tee -a "$RUTA_LOG"
          npm ci 2>&1 | tee -a "$RUTA_LOG"
          { echo; echo "===== npm run verificar:build ====="; } | tee -a "$RUTA_LOG"
          npm run verificar:build 2>&1 | tee -a "$RUTA_LOG"

      # LAS MIGRACIONES SON LO UNICO QUE NINGUN OTRO PASO EJECUTA.
      #
      # `prisma generate` lee el schema, no las migraciones. `tsc`, ESLint, Jest y el build ni
      # las miran. El SQL de `prisma/migrations/` solo corria en un sitio —`migrate deploy`—
      # y ese sitio era produccion: una migracion es codigo que corre UNA vez, en el peor
      # momento y sobre los unicos datos que no se pueden perder.
      #
      # El 18/09/2026 eso costo un despliegue: `UPDATE "plantilla_nivel" SET "nombre" = …`
      # sobre una tabla cuya columna se llama `nombre_nivel_3`. Verde en los cinco checks,
      # `42703` contra la base real, y la migracion quedo marcada como fallida bloqueando
      # todas las siguientes.
      #
      # Postgres efimero y aparte: el runner ES el host de produccion, y la base de al lado es
      # la de verdad. Puerto 0 = el que el sistema tenga libre, para no chocar con el 5432 que
      # ya esta ocupado ahi.
      - name: Verificación — las migraciones aplican sobre una base vacía
        run: |
          set -euo pipefail
          CONTENEDOR="verificacion-pg-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "CONTENEDOR_PG=$CONTENEDOR" >> "$GITHUB_ENV"
          docker run -d --rm --name "$CONTENEDOR" \
            -e POSTGRES_PASSWORD=verificacion -e POSTGRES_USER=verificacion \
            -e POSTGRES_DB=verificacion -p 127.0.0.1:0:5432 postgres:17-alpine
          PUERTO="$(docker port "$CONTENEDOR" 5432/tcp | head -1 | sed 's/.*://')"
          for i in $(seq 1 30); do
            if docker exec "$CONTENEDOR" pg_isready -U verificacion -d verificacion >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then echo "El Postgres de verificación no levantó."; exit 1; fi
            sleep 1
          done
          { echo; echo "===== npm run verificar:migraciones ====="; } | tee -a "$RUTA_LOG"
          DATABASE_URL="postgresql://verificacion:verificacion@127.0.0.1:$PUERTO/verificacion" \
            npm run verificar:migraciones 2>&1 | tee -a "$RUTA_LOG"

      # EL ERROR, EN LA PÁGINA QUE LA PERSONA YA ESTÁ MIRANDO.
      #
      # Hasta acá el PR rojo decía «algo falló» y un enlace. Para saber SI fue un tipo, una
      # regla de ESLint, una prueba o una migración había que abrir el run, elegir el trabajo,
      # desplegar el paso y buscar el error real en miles de líneas. Esa fricción es la que
      # termina en «lo miro después» y en un merge que despliega a producción.
      #
      # Se comenta sólo en PR: `workflow_dispatch` corre sobre una rama suelta, sin PR donde
      # comentar, y la API respondería 404.
      #
      # `continue-on-error` no es opcional. Si este paso se pusiera rojo —la API caída, un
      # permiso retirado— pasaría a ser el último error del trabajo y taparía justo lo que vino
      # a explicar. Es la misma lección que ya dejó escrita el diagnóstico del despliegue.
      - name: Comentar el error en el PR
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // La marca va en un comentario HTML: no se ve al leer, y es lo que permite
            // ACTUALIZAR el comentario en vez de apilar uno nuevo por cada push al PR. Un hilo
            // con ocho informes de error idénticos es ruido, y el último queda enterrado.
            const MARCA = '<!-- verificacion:error -->';
            const LINEAS = 120;
            const TOPE = 20000; // el cuerpo de un comentario admite 65536; se deja margen

            let salida = '';
            try {
              salida = fs.readFileSync(process.env.RUTA_LOG, 'utf8');
            } catch {
              salida = '(no quedó log: la verificación se cayó antes de empezar a escribirlo)';
            }

            // Los códigos de color de npm y Jest se ven como basura dentro de un bloque de
            // código de Markdown.
            salida = salida.replace(/\u001b\[[0-9;]*m/g, '');

            let cola = salida.split('\n').slice(-LINEAS).join('\n');
            if (cola.length > TOPE) cola = cola.slice(-TOPE);

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const cuerpo = [
              MARCA,
              '### La verificación falló',
              '',
              'Este PR **no debería mergearse** así: en este repo mergear a `main` despliega a',
              'producción, sin staging ni revisión posterior.',
              '',
              `Últimas ${LINEAS} líneas de la salida — el log completo está en [el run](${run}):`,
              '',
              '```',
              cola,
              '```',
              '',
              '<sub>Reproducible en local con `npm run verificar:build`.</sub>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Los comentarios de un PR viven en la API de issues; no es un atajo, es dónde
            // están.
            const previos = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const mio = previos.find((c) => (c.body || '').includes(MARCA));

            if (mio) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mio.id, body: cuerpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: cuerpo,
              });
            }

      # Se para SIEMPRE, incluso con la verificación en rojo — que es justo cuando uno se
      # olvidaría. `--rm` en el `docker run` hace el resto.
      - name: Apagar el Postgres de verificación
        if: always()
        run: docker rm -f "${CONTENEDOR_PG:-}" 2>/dev/null || true

      # El workspace del runner persiste entre ejecuciones y `node_modules` pesa alrededor de
      # un giga. En esta máquina eso importa: el despliegue #41 murió con `No space left on
      # device` y por eso existe el preflight de disco en `deploy.yml`. Se limpia siempre,
      # incluso con la verificación en rojo, que es justo cuando uno se olvidaría.
      #
      # El caché de npm (`~/.npm`) NO se toca: es lo que hace que el `npm ci` siguiente no
      # vuelva a bajar el árbol entero de internet.
      - name: Liberar el espacio de node_modules
        if: always()
        run: rm -rf node_modules .next
